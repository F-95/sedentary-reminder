# 在推送 v* 标签时于 Windows 上构建 Tauri 安装包并上传至 GitHub Releases（正式发布，非草稿）
# 注意：tauri-action 仓库无 @v1 标签，必须使用 @v0 或 @action-x.y.z，否则工作流无法解析 Action。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "已存在的 Git 标签（例如 v0.1.0），用于检出代码并关联 Release"
        required: true
        default: "v0.1.3"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 手动运行时按输入检出对应标签；标签推送事件使用默认 ref
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: swatinem/rust-cache@v2
        with:
          # 子目录 Cargo 工程：仅写工作区路径，由 rust-cache 自动识别 target 目录
          workspaces: |
            src-tauri

      - name: 安装前端依赖（锁定版本）
        run: npm ci

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: "久坐提醒 v__VERSION__"
          releaseBody: "Windows 安装包见下方 Assets。NSIS 为安装向导，MSI 为企业/静默部署常用格式。"
          releaseDraft: false
          prerelease: false
          # action.yml 中参数名为 includeUpdaterJson（非 uploadUpdaterJson）
          includeUpdaterJson: false
          tauriScript: npm run tauri
