# 在推送 v* 标签时于 Windows 上构建 Tauri 安装包并上传至 GitHub Releases（正式发布，非草稿）
# 注意：tauri-action 仓库无 @v1 标签，必须使用 @v0 或 @action-x.y.z，否则工作流无法解析 Action。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "已存在的 Git 标签（例如 v0.1.0），用于检出代码并关联 Release"
        required: true
        default: "v0.1.5"

# 需要创建 Release 并上传 Assets：须为 write（若仓库设为只读，下方声明无效，见文件末尾注释）
permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    # 与顶层一致；部分环境下 job 级权限更明确，避免 token 仅读导致 create release 403
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 手动运行时按输入检出对应标签；标签推送事件使用默认 ref
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: swatinem/rust-cache@v2
        with:
          # 子目录 Cargo 工程：仅写工作区路径，由 rust-cache 自动识别 target 目录
          workspaces: |
            src-tauri

      - name: 安装前端依赖（锁定版本）
        run: npm ci

      # 从 CHANGELOG.md 提取当前标签对应版本的小节；缺失则失败，避免无说明发布
      # release_body 由 Node 直接写入 GITHUB_OUTPUT（随机分隔符），避免 Windows/bash heredoc 解析失败
      - name: 从 CHANGELOG 生成 Release 正文
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          node scripts/changelog-for-release.mjs "$VERSION"

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: "久坐提醒 v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          # action.yml 中参数名为 includeUpdaterJson（非 uploadUpdaterJson）
          includeUpdaterJson: false
          tauriScript: npm run tauri
# 排查「Resource not accessible by integration / create-a-release」：
# 1) GitHub 仓库 Settings → Actions → General → Workflow permissions
#    勾选「Read and write permissions」并保存（若为 Read repository contents only，则无法创建 Release）
# 2) 组织（Organization）若启用默认只读，需在组织或本仓库中允许对该仓库的读写 Workflow 权限
